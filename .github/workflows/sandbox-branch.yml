# NextBlock sandbox branch — publishes `master` + the sandbox-only Vercel cron.
#
# `vercel.json` on master carries NO `crons`: the same file ships to every Vercel 1-click
# install (and the daily upstream sync merges master into those repos), and a Hobby
# account fails the whole deployment on any schedule more frequent than once a day.
# The public sandbox (cms.nextblock.dev, Vercel Pro) still needs its 15-minute reset,
# so this workflow regenerates a `sandbox` branch = master + one commit that adds the
# cron. Point the sandbox Vercel project's Production Branch at `sandbox`; nothing else
# changes. The branch is force-pushed on every master push, so never commit to it.
#
# Runs only in the upstream repository — in a 1-click copy the job is skipped.

name: NextBlock Sandbox Branch

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sandbox-branch
  cancel-in-progress: true

jobs:
  publish:
    if: github.repository == 'nextblock-cms/nextblock'
    runs-on: ubuntu-latest
    env:
      SANDBOX_BRANCH: sandbox
    steps:
      - name: Checkout master
        uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 1

      - name: Configure the committing identity
        # Vercel refuses deploys whose commit author is not a real GitHub account, so
        # author the commit as the person who pushed, with their github.com noreply.
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"

      - name: Add the sandbox reset cron to vercel.json
        run: node tools/scripts/write-sandbox-vercel-config.js

      - name: Commit and force-push the sandbox branch (triggers the sandbox deploy)
        run: |
          git add vercel.json
          git commit -m "chore(sandbox): add the 15-minute reset cron to vercel.json" \
            -m "Generated from master by the NextBlock Sandbox Branch workflow. Do not edit this branch by hand."
          git push --force origin "HEAD:${SANDBOX_BRANCH}"
          echo "Published ${SANDBOX_BRANCH} from master@${GITHUB_SHA}."
